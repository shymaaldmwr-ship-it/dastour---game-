<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة دستور الأردن - الصف الرابع</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%);min-height:100vh;color:white;padding:15px}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;padding:20px 0}
.header h1{font-size:28px;font-weight:800;color:#fbbf24}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:25px;margin:20px 0}
.question{font-size:22px;font-weight:700;line-height:1.6;margin-bottom:20px}
.options{display:grid;gap:12px}
.option{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:14px;padding:16px;font-size:18px;cursor:pointer;text-align:right}
.option.correct{background:rgba(34,197,94,0.3)!important;border-color:#22c55e!important}
.option.wrong{background:rgba(239,68,68,0.3)!important;border-color:#ef4444!important}
.btn{background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#000;border:none;padding:14px 30px;border-radius:12px;font-size:18px;font-weight:800;cursor:pointer;width:100%;margin-top:15px}
.progress{height:8px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin:15px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.lifelines{display:flex;gap:10px;justify-content:center;margin:15px 0}
.lifeline{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:50px;padding:8px 15px;font-size:14px;cursor:pointer}
.hidden{display:none}
.result{text-align:center}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>👑 لعبة دستور الأردن</h1>
<p>الصف الرابع - من سيربح المعلومة؟</p>
<div class="progress"><div class="progress-bar" id="progress"></div></div>
</div>
<div id="startScreen" class="card" style="text-align:center">
<h2>هل أنت مستعد لاختبار معلوماتك عن دستور وطنك؟</h2>
<p>15 سؤال من كتاب التربية الوطنية</p>
<button class="btn" onclick="startGame()">ابدأ اللعبة 🚀</button>
</div>
<div id="gameScreen" class="hidden">
<div class="card">
<div id="qCount"></div>
<div class="question" id="questionText"></div>
<div class="options" id="options"></div>
<button class="btn hidden" id="nextBtn" onclick="nextQuestion()">التالي ⏩</button>
</div>
</div>
<div id="endScreen" class="card hidden result">
<h2 id="resultTitle"></h2>
<p id="resultText"></p>
<p>نتيجتك: <span id="finalScore" style="color:#fbbf24;font-weight:800;font-size:24px"></span></p>
<button class="btn" onclick="startGame()">إعادة 🔄</button>
</div>
</div>
<script>
const questions=[
{q:"متى صدر دستور الأردن الحالي؟",o:["1946","1952","1967","1999"],a:1},
{q:"نظام الحكم في الأردن هو:",o:["جمهوري","نيابي ملكي وراثي","رئاسي","إمارة"],a:1},
{q:"من هو مصدر السلطات؟",o:["الملك","الشعب","مجلس النواب","الحكومة"],a:1},
{q:"دين الدولة هو:",o:["المسيحية","الإسلام","اليهودية","لا دين"],a:1},
{q:"اللغة الرسمية هي:",o:["الإنجليزية","العربية","الفرنسية","العربية والإنجليزية"],a:1},
{q:"العاصمة هي:",o:["الزرقاء","عمان","إربد","العقبة"],a:1},
{q:"الأردنيون أمام القانون:",o:["متفاوتون","سواء","حسب العشيرة","حسب المنصب"],a:1},
{q:"السلطة التشريعية تتكون من:",o:["الملك فقط","مجلس الأمة والملك","الحكومة فقط","المحكمة"],a:1},
{q:"مجلس الأمة يتكون من:",o:["النواب فقط","الأعيان فقط","الأعيان والنواب","الملك والوزراء"],a:2},
{q:"من يعين رئيس الوزراء؟",o:["الشعب","النواب","الملك","الأعيان"],a:2},
{q:"مدة مجلس النواب:",o:["سنتان","أربع سنوات","ست سنوات","ثمان"],a:1},
{q:"حق التعليم مكفول لـ:",o:["الأغنياء","المواطنين","الذكور","الموظفين"],a:1},
{q:"من يملك حق إعلان الحرب؟",o:["رئيس الوزراء","الملك","مجلس الأمة","وزير الدفاع"],a:1},
{q:"الدستور يتكون من:",o:["100 مادة","127 مادة","150 مادة","90 مادة"],a:1},
{q:"شعار المملكة يمثل:",o:["رمز الدولة","زينة","شعار الملك","شعار الجيش"],a:0}
];
let cur=0,score=0;
function startGame(){cur=0;score=0;document.getElementById('startScreen').classList.add('hidden');document.getElementById('endScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');showQ();}
function showQ(){let q=questions[cur];document.getElementById('qCount').innerText=`السؤال ${cur+1} / ${questions.length}`;document.getElementById('questionText').innerText=q.q;document.getElementById('progress').style.width=`${(cur/questions.length)*100}%`;let optDiv=document.getElementById('options');optDiv.innerHTML='';document.getElementById('nextBtn').classList.add('hidden');q.o.forEach((opt,i)=>{let d=document.createElement('div');d.className='option';d.innerText=opt;d.onclick=()=>check(i,d);d.id='opt'+i;optDiv.appendChild(d);});}
function check(i,el){let q=questions[cur];document.querySelectorAll('.option').forEach(o=>o.style.pointerEvents='none');if(i===q.a){el.classList.add('correct');score+=10;}else{el.classList.add('wrong');document.getElementById('opt'+q.a).classList.add('correct');}document.getElementById('nextBtn').classList.remove('hidden');if(cur===questions.length-1)document.getElementById('nextBtn').innerText='النتيجة 🏆';}
function nextQuestion(){if(cur<questions.length-1){cur++;showQ();}else{endGame();}}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('endScreen').classList.remove('hidden');document.getElementById('progress').style.width='100%';document.getElementById('finalScore').innerText=`${score} / 150`;let t=document.getElementById('resultTitle');if(score>=120)t.innerText='خبير الدستور! 👑';else if(score>=80)t.innerText='بطل وطني! 🇯🇴';else t.innerText='حاول مرة أخرى 📚';}
</script>
</body>
</html>
